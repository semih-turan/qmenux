packages:
  - apps/*
  - packages/*

# Only reviewed framework build hooks may execute during installation.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

# Remove when NestJS includes the GHSA-q7qp-rjg7-q26m fix upstream.
overrides:
  '@nestjs/platform-express>multer': 2.5.0
  # Remove when the Vercel SDK transitively includes the GHSA-mrhx-c7xc-m3w5 fix.
  '@vercel/cli-config>zod': 4.6.7
